name: AZRAEL auto-build (Android + Windows/Linux desktop)

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Android
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azrael-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk

  windows:
    name: Windows 10/11 MSI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Windows MSI
        run: |
          ./gradlew :desktopApp:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azrael-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Linux packages
        run: |
          ./gradlew :desktopApp:packageAppImage :desktopApp:packageDeb

      - name: Package real AppImage (appimagetool)
        run: |
          set -euxo pipefail
          curl -fsSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool

          APP_DIR=desktopApp/build/compose/binaries/main/app
          SRC=$APP_DIR/xyz.azraellab.app
          AD=/tmp/azrael-appdir
          rm -rf "$AD"
          mkdir -p "$AD"
          cp -r "$SRC/bin" "$AD/bin"
          cp -r "$SRC/lib" "$AD/lib"
          cp "$SRC/lib/xyz.azraellab.app.png" "$AD/xyz.azraellab.app.png"
          cat > "$AD/xyz.azraellab.app.desktop" <<'EOF'
          [Desktop Entry]
          Name=AZRAEL-APP
          Comment=AZRAEL desktop application (Compose Multiplatform)
          Exec=xyz.azraellab.app
          Icon=xyz.azraellab.app
          Type=Application
          Categories=Utility;Application;
          Terminal=false
          EOF
          cat > "$AD/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/bin/xyz.azraellab.app" "$@"
          EOF
          chmod +x "$AD/AppRun" "$AD/bin/xyz.azraellab.app"
          APP_VERSION=$(sed -n 's/.*<app-version>\([^<]*\)<\/app-version>.*/\1/p' "$SRC/lib/app/.jpackage.xml")
          export ARCH=x86_64
          /tmp/appimagetool --appimage-extract-and-run "$AD" "$APP_DIR/xyz.azraellab.app-$APP_VERSION.AppImage"
          ls -la "$APP_DIR"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: azrael-linux-packages
          path: |
            desktopApp/build/compose/binaries/main/app/*.AppImage
            desktopApp/build/compose/binaries/main/deb/*.deb

  release:
    name: GitHub Release (tags v*)
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Install gh
        run: |
          command -v gh || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find artifacts -type f \( -name '*.apk' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' \) -print0)
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AZRAEL-APP $TAG_NAME" \
            --notes "Autogenerated by CI. Artifacts: Android APK (debug/release), Windows MSI, Linux AppImage/deb." \
            "${files[@]}"