name: AZRAEL auto-build (Android + Windows/Linux desktop)

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK (debug + release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: azrael-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk

  windows:
    name: Windows 10/11 MSI installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows MSI
        run: |
          ./gradlew :desktopApp:packageMsi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: azrael-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi

  linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux packages
        run: |
          ./gradlew :desktopApp:packageAppImage :desktopApp:packageDeb

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: azrael-linux-packages
          path: |
            desktopApp/build/compose/binaries/main/app/*.AppImage
            desktopApp/build/compose/binaries/main/deb/*.deb

  release:
    name: GitHub Release (tags v*)
    runs-on: ubuntu-latest
    needs: [android, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install gh
        run: |
          command -v gh || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AZRAEL-APP $TAG_NAME" \
            --notes "Autogenerated by CI. Artifacts: Android APK (debug/release), Windows MSI, Linux AppImage/deb." \
            artifacts/*